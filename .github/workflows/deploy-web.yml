name: Deploy web UI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pin to the Emscripten release used for local builds
      # (web/emsdk/upstream/emscripten/emscripten-version.txt).
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git web/emsdk
          cd web/emsdk
          ./emsdk install 6.0.6
          ./emsdk activate 6.0.6

      - name: Build WASM + frontend
        run: |
          source web/emsdk/emsdk_env.sh
          make -C web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
