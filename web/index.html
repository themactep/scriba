<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scriba · Web SPI Flasher</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔌</text></svg>">
    <style>
        :root { --bs-font-sans-serif: system-ui, -apple-system, sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: #0d1117; }
        .flasher-card { width: 100%; max-width: 720px; }
        .card-title { color: #58a6ff !important; }
        #log {
            height: 280px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 0.6rem;
        }
        #log .info { color: #c9d1d9; }
        #log .debug { color: #484f58; }
        #log .warn { color: darkorange !important; }
        #log .error { color: #f85149; }
        .device-info { font-size: 0.9rem; }
        .device-info .label { color: #8b949e; }
        .device-info .value { color: #58a6ff !important; font-family: monospace; }
        .progress { height: 6px; }
        .file-info { font-size: 0.85rem; color: #8b949e; }
        input[type="file"] { display: none; }
        @keyframes pulse-warn {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @media (max-width: 576px) {
            body { padding: 0.5rem !important; }
            .card-header { padding: 0.6rem 0.75rem; }
            .card-body { padding: 0.75rem; }
            .card-footer { padding: 0.75rem; }
            .card-header .card-title { font-size: 0.95rem !important; }
            #chip-disconnected { text-align: center; }
            #chip-disconnected .btn { width: 100%; }
            #chip-disconnected .text-secondary { display: block; margin-top: 0.4rem; margin-left: 0 !important; }
            #chip-info .row { flex-direction: column; gap: 0.15rem !important; }
            .card-footer .d-flex { flex-direction: column; }
            .card-footer .d-flex .btn { width: 100%; }
            #log { height: 200px; font-size: 0.7rem; }
        }
    </style>
</head>
<body class="p-3">

<div class="flasher-card">
    <!-- Header -->
    <div class="card mb-3">
        <div class="card-header d-flex align-items-center gap-2">
            <h2 class="card-title mb-0 fs-5" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">
                <i class="bi bi-cpu me-1"></i><span class="d-none d-sm-inline"> Scriba Web SPI Flasher</span><span class="d-sm-none"> Scriba Flasher</span>
            </h2>
            <span id="status-badge" class="badge bg-secondary ms-auto">Idle</span>
        </div>

        <div id="op-warning" class="card-header bg-danger bg-opacity-10 text-danger text-center py-1 d-none" style="animation: pulse-warn 1.5s infinite;">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <small class="fw-600">Do not disconnect the programmer or navigate away during this operation</small>
        </div>

        <!-- Chip Info -->
        <div class="card-body">
            <div id="chip-disconnected">
                <button id="btn-connect" class="btn btn-outline-primary btn-sm" onclick="connectDevice()"
                    data-bs-toggle="tooltip" title="Connect a CH341A or EZP2019 SPI programmer via WebUSB">
                    <i class="bi bi-usb-symbol me-1"></i> Connect Programmer
                </button>
                <span class="text-secondary ms-2 small">WebUSB requires Chrome or Edge</span>
            </div>
            <div id="chip-info" class="device-info d-none">
                <div class="row g-2">
                    <div class="col-auto"><span class="label">Chip:</span> <span class="value" id="info-chip"></span></div>
                    <div class="col-auto"><span class="label">Size:</span> <span class="value" id="info-size"></span></div>
                    <div class="col-auto"><span class="label">Programmer:</span> <span class="value" id="info-programmer"></span></div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="card-footer">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <button id="btn-read-id" class="btn btn-outline-secondary btn-sm" onclick="readChipId()"
                    data-bs-toggle="tooltip" title="Re-detect the flash chip">
                    <i class="bi bi-search me-1"></i> Detect
                </button>
                <button id="btn-read" class="btn btn-outline-info btn-sm" onclick="doRead()" disabled
                    data-bs-toggle="tooltip" title="Read the entire flash and download as .bin">
                    <i class="bi bi-upload me-1"></i> Read Flash
                </button>
                <button id="btn-write" class="btn btn-outline-warning btn-sm" onclick="selectFirmware()" disabled
                    data-bs-toggle="tooltip" title="Write a firmware .bin file to flash">
                    <i class="bi bi-download me-1"></i> Write Flash
                </button>
                <button id="btn-erase" class="btn btn-outline-danger btn-sm" onclick="doErase()" disabled
                    data-bs-toggle="tooltip" title="Erase the entire flash chip">
                    <i class="bi bi-trash me-1"></i> Erase
                </button>
            </div>
            <div class="file-info mt-1" id="file-info"></div>
            <button id="btn-start-write" class="btn btn-warning btn-sm mt-1 d-none" onclick="doWrite()"
                data-bs-toggle="tooltip" title="Erase, write, and verify the flash with the selected firmware">
                <i class="bi bi-lightning-fill me-1"></i> Start Write
            </button>
            <input type="file" id="firmware-file" accept=".bin,.rom,.img" onchange="firmwareSelected(this)">

            <div id="progress" class="mt-2 d-none">
                <div class="progress">
                    <div class="progress-bar bg-warning" id="progress-fill" role="progressbar" style="width: 0%"></div>
                </div>
                <small class="text-secondary" id="progress-label">Initializing...</small>
            </div>
        </div>
    </div>

    <!-- Log -->
    <div class="card">
        <div class="card-header d-flex align-items-center gap-2">
            <h2 class="card-title mb-0 fs-6">
                <i class="bi bi-terminal me-1"></i> Log
            </h2>
            <button class="btn btn-outline-secondary btn-sm ms-auto" onclick="toggleEraseDebug()"
                id="btn-erase-debug" title="Toggle erase/USB debug logging">
                <i class="bi bi-bug me-1"></i>Debug
            </button>
        </div>
        <div class="card-body p-2">
            <div id="log"></div>
        </div>
    </div>
</div>

<p class="mt-2 small text-center" id="version-text">
    <a href="https://github.com/wltechblog/scriba" target="_blank" class="text-secondary text-decoration-none">scriba</a>
    web-wasm
</p>

<div id="browser-warning" class="alert alert-danger flasher-card mt-3 text-center d-none">
    <i class="bi bi-exclamation-triangle me-1"></i>
    WebUSB requires <strong>HTTPS</strong> (or localhost) and <strong>Chrome</strong> or <strong>Edge</strong>.
</div>

<script src="/wasm/scriba.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
